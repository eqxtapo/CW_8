name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE: eqxtapo/cw8-app
  VERSION: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: test_db         # наша тестовая база
      POSTGRES_USER: test_user     # наш тестовый пользователь
      POSTGRES_PASSWORD: test_password
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.11'

        - name: Install PostgreSQL client
          run: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client

        - name: Wait for PostgreSQL
          run: |
            echo "Waiting for PostgreSQL to be ready..."
            for i in {1..30}; do
              if pg_isready -h localhost -p 5432; then
                echo "PostgreSQL is ready!"
                break
              fi
              echo "Attempt $i/30 - waiting..."
              sleep 2
            done

        - name: Create test user and database
          run: |
            echo "Setting up test database structure..."
            PGPASSWORD=test_password psql -h localhost -U postgres -d postgres << EOF
            -- Создаем пользователя для тестов
            CREATE USER test_user WITH PASSWORD 'test_password';
            
            -- Создаем базу данных для тестов
            CREATE DATABASE test_db OWNER test_user;
            
            -- Даем права
            GRANT ALL PRIVILEGES ON DATABASE test_db TO test_user;
            ALTER USER test_user CREATEDB;
            EOF
            echo "Database setup completed"

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install psycopg2-binary

        - name: Create static directory
          run: |
            mkdir -p static

        - name: Run migrate
          run: |
            python manage.py migrate

        - name: Run tests
          run: |
            python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker images
      run: |
        docker-compose -f docker-compose.yml build

    - name: Test Docker compose
      run: |
        docker-compose -f docker-compose.yml up -d
        sleep 10
        docker-compose ps
        docker-compose down

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /opt/cw8-app
          git pull origin main
          docker-compose down
          docker-compose pull
          docker-compose up -d --build
          docker system prune -f