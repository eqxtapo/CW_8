name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE: eqxtapo/cw8-app
  VERSION: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: settings
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Debug - Check current directory and settings
      run: |
          echo "Current directory:"
          pwd
          echo "Files in directory:"
          ls -la
          echo "Settings file content (DATABASES section):"
          if [ -f "CW_8/settings.py" ]; then
            grep -A 15 "DATABASES" CW_8/settings.py || echo "DATABASES section not found"
          else
            echo "CW_8/settings.py not found!"
            find . -name "settings.py" -type f
          fi

    - name: Debug - Check PostgreSQL connection
      run: |
        echo "Testing PostgreSQL connection..."
        which psql || echo "psql not installed"
        pg_isready -h localhost -p 5432 || echo "pg_isready failed"
        PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -c "SELECT version();" || echo "Connection failed"
        echo "Exit code: $?"

    - name: Debug - Check environment variables
      run: |
        echo "Environment variables:"
        echo "DB_HOST: $DB_HOST"
        echo "DB_PORT: $DB_PORT"
        echo "POSTGRES_DB: $POSTGRES_DB"
        echo "POSTGRES_USER: $POSTGRES_USER"
        echo "POSTGRES_PASSWORD: $POSTGRES_PASSWORD"
        echo "SECRET_KEY: $SECRET_KEY"

    - name: Debug - Check Django database configuration
      run: |
        python -c "
        import os
        os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'CW_8.settings')
        try:
            from django.conf import settings
            from django import setup
            setup()
            print('Database settings:', settings.DATABASES['default'])
            print('ENGINE:', settings.DATABASES['default']['ENGINE'])
            print('HOST:', settings.DATABASES['default'].get('HOST', 'NOT SET'))
            print('PORT:', settings.DATABASES['default'].get('PORT', 'NOT SET'))
        except Exception as e:
            print('Error loading settings:', e)
            import traceback
            traceback.print_exc()
        "

    - name: Check PostgreSQL service status
      run: |
        echo "Docker containers:"
        docker ps
        echo "PostgreSQL container logs:"
        docker logs $(docker ps -q --filter 'ancestor=postgres:13') 2>/dev/null || echo "No PostgreSQL container found"

    - name: Wait for PostgreSQL
      run: |
        timeout 30s bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

    - name: Run migrate
      run: |
        python manage.py migrate

    - name: Run tests
      run: |
        python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker images
      run: |
        docker-compose -f docker-compose.yml build

    - name: Test Docker compose
      run: |
        docker-compose -f docker-compose.yml up -d
        sleep 10
        docker-compose ps
        docker-compose down

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /opt/cw8-app
          git pull origin main
          docker-compose down
          docker-compose pull
          docker-compose up -d --build
          docker system prune -f